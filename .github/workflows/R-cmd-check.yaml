name: R-CMD-check

on:
  pull_request:
    branches: [master]
  # for manual trigger
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false
        default: 'Testing cache'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # R CMD check launches nested vanilla R processes while scanning tests.
      # A repository file reaches those children; parent options(repos) does not.
      R_REPOSITORIES: ${{ github.workspace }}/.github/ci-repositories

    steps:
      - uses: actions/checkout@v6

      - name: Create this folder to silence warning
        run: mkdir -p ~/.nix-defexpr/channels

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      
      - name: Configure osmzhlab Attic cache
        run: bash .github/scripts/setup-osmzhlab-cache.sh

      # Install R package dependencies via nix-shell, using the default.nix file in the repository
      - name: Install R package dependencies
        run: nix-shell default.nix --run "echo 'R package dependencies installed'"

      - name: Build source tarball
        run: nix-shell default.nix --run "R CMD build ."

      # Check the distributable outside the checkout, without development tools.
      # The test suite runs in the three shards of R-tests.yaml; running it
      # here again took about 9 of this job's 12 minutes.
      - name: Run R-CMD-check
        run: |
          mkdir -p "$RUNNER_TEMP/cerebro-cran-check"
          cp CerebroNexus_*.tar.gz "$RUNNER_TEMP/cerebro-cran-check/"
          cd "$RUNNER_TEMP/cerebro-cran-check"
          nix-shell "$GITHUB_WORKSPACE/default.nix" --run '
            set -eu
            unset CI NOT_CRAN NODE_PATH
            export NODE_OPTIONS=--no-global-search-paths
            R CMD check --as-cran --no-manual --no-tests CerebroNexus_*.tar.gz
            test -f CerebroNexus.Rcheck/00check.log
            ! grep -E "^Status:.*(ERROR|WARNING)" CerebroNexus.Rcheck/00check.log
          '

      - name: Upload check results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: r-cmd-check-results
          path: "${{ runner.temp }}/cerebro-cran-check/*.Rcheck/"
          retention-days: 14
