name: R tests

on:
  pull_request:
    branches: [master]
  workflow_dispatch: # This adds the manual trigger
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false
        default: 'Testing cache'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ## The suite runs as three shards on three runners at once; each shard
  ## takes every third test file (alphabetical), so the Builder files spread
  ## evenly. `test` below is the check branch protection requires.
  test-shard:
    name: test (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: "true"

    steps:
      - uses: actions/checkout@v6

      - name: Create this folder to silence warning
        run: mkdir -p ~/.nix-defexpr/channels

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Configure osmzhlab Attic cache
        run: bash .github/scripts/setup-osmzhlab-cache.sh

      # Install R package dependencies via nix-shell, using the default.nix file in the repository
      - name: Install R package dependencies
        run: nix-shell default.nix --run "echo 'R package dependencies installed'"

      ## Run this shard's tests from source. test_local() loads the package in each
      ## worker, so DESCRIPTION's Config/testthat/parallel takes effect; the
      ## runner's four cores run four test files at a time.
      ## Builder workers and the Builder browser tests run library(CerebroNexus)
      ## in their own processes, so install this checkout into a private library
      ## first; without it those tests skip.
      - name: Run this shard's unit/integration tests
        env:
          TESTTHAT_CPUS: "4"
          CEREBRO_RUN_BROWSER_TESTS: "true"
          SHARD: ${{ matrix.shard }}
          SHARDS: "3"
        run: |
          lib="$RUNNER_TEMP/cerebro-lib"
          mkdir -p "$lib"
          nix-shell default.nix --run "R CMD INSTALL --no-docs --library='$lib' ."
          R_LIBS="$lib" nix-shell default.nix --run "Rscript .github/scripts/test-shard.R"

      ## Upload shinytest2 failure artifacts (PNG diffs, logs) — unit test failures are in the log
      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shinytest2-failures-shard-${{ matrix.shard }}
          path: |
            tests/testthat/_snaps/
            /tmp/shinytest2*
          retention-days: 14

  test:
    needs: test-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All test shards passed
        run: test "${{ needs.test-shard.result }}" = "success"
