name: R tests

on:
  pull_request:
    branches: [master]
  workflow_dispatch: # This adds the manual trigger
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false
        default: 'Testing cache'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: "true"

    steps:
      - uses: actions/checkout@v6

      - name: Create this folder to silence warning
        run: mkdir -p ~/.nix-defexpr/channels

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Configure osmzhlab Attic cache
        run: bash .github/scripts/setup-osmzhlab-cache.sh

      # Install R package dependencies via nix-shell, using the default.nix file in the repository
      - name: Install R package dependencies
        run: nix-shell default.nix --run "echo 'R package dependencies installed'"

      ## Run all tests from source. test_local() loads the package in each
      ## worker, so DESCRIPTION's Config/testthat/parallel takes effect; the
      ## runner's four cores run four test files at a time.
      - name: Run all unit/integration tests
        env:
          TESTTHAT_CPUS: "4"
        run: |
          nix-shell default.nix --run "Rscript -e \"
            testthat::test_local(
              '.',
              reporter = testthat::default_reporter(),
              stop_on_failure = TRUE
            )
          \""

      ## Upload shinytest2 failure artifacts (PNG diffs, logs) — unit test failures are in the log
      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shinytest2-failures
          path: |
            tests/testthat/_snaps/
            /tmp/shinytest2*
          retention-days: 14
