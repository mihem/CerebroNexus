name: Xenium Prime image preparation

on:
  pull_request:
    branches: [master]
    paths:
      - data-raw/large-demo/prepare_xenium_prime_image.py
      - tests/python/**
      - .github/workflows/xenium-prime-image.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install numpy tifffile imagecodecs Pillow
      - run: python -m unittest discover -s tests/python -v
