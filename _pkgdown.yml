url: https://mihem.github.io/CerebroNexus/

template:
  bootstrap: 5
  light-switch: true

navbar:
  structure:
    left: [home, reference, articles, news]
    right: [search, github, homepage, lightswitch]
  components:
    github:
      icon: fab fa-github
      aria-label: GitHub repository
      href: https://github.com/mihem/CerebroNexus
    homepage:
      icon: fas fa-globe
      aria-label: Maintainer website
      href: https://mheming.com/

reference:
  - title: "Launch Cerebro"
    contents:
      - starts_with("launchCerebro")
  - title: "Export data"
    contents:
      - starts_with("exportFrom")
      - exportToH5ad
  - title: "Convert data"
    contents:
      - starts_with("convert")
      - readH5adAsSCE
      - readSpatialDataAsSCE
  - title: "Pre-processing"
    contents:
      - addPercentMtRibo
      - calculatePercentGenes
      - getMostExpressedGenes
      - getMarkerGenes
      - getEnrichedPathways
      - performGeneSetEnrichmentAnalysis
      - extractMonocleTrajectory
  - title: "Internal"
    contents:
      - Cerebro
      - starts_with(".")

articles:
  - title: "Workflows"
    navbar: Workflows
    contents:
      - cerebronexus_workflow_seurat
      - articles/export_a_data_set_in_SCE_format
      - use_sce_and_anndata_data
  - title: "Data model"
    navbar: Interface
    contents:
      - overview_of_cerebro_class
  - title: "How-to guides"
    navbar: How-to
    contents:
      - articles/build_a_data_set_by_pointing
      - articles/data_integrity_contracts
      - articles/seurat_v5_layered_assays
      - articles/create_a_self_contained_shiny_app
      - articles/create_expression_matrix_in_h5_format
      - articles/million_cell_crb_artifacts
      - articles/launch_cerebro_with_pre-loaded_data_set
      - articles/multi_crb
      - articles/export_and_visualize_custom_tables_and_plots
      - articles/control_access_to_cerebro_with_a_login_page
      - articles/host_cerebro_on_shinyapps
  - title: "Benchmarks"
    navbar: Benchmarks
    contents:
      - articles/expression_backend_benchmark
  - title: "Module guides"
    navbar: Modules
    contents:
      - articles/most_expressed_genes
      - articles/enriched_pathways
      - articles/extra_material
      - articles/immune_repertoire_analysis
