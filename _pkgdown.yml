url: https://www.mheming.com/CerebroNexus/

redirects:
  - ["articles/use_sce_and_anndata_data.html", "articles/import_your_analysis.html"]
  - ["articles/multi_crb.html", "articles/create_a_self_contained_shiny_app.html"]
  - ["articles/launch_cerebro_with_pre-loaded_data_set.html", "articles/create_a_self_contained_shiny_app.html"]
  - ["articles/host_cerebro_on_shinyapps.html", "articles/create_a_self_contained_shiny_app.html"]
  - ["articles/most_expressed_genes.html", "articles/tables_and_plots.html"]
  - ["articles/enriched_pathways.html", "articles/tables_and_plots.html"]
  - ["articles/extra_material.html", "articles/tables_and_plots.html"]
  - ["articles/export_and_visualize_custom_tables_and_plots.html", "articles/tables_and_plots.html"]
  - ["articles/create_expression_matrix_in_h5_format.html", "articles/million_cell_crb_artifacts.html"]

template:
  bootstrap: 5
  light-switch: true

navbar:
  structure:
    left: [home, reference, articles, news]
    right: [search, github, homepage, lightswitch]
  components:
    github:
      icon: fab fa-github
      aria-label: GitHub repository
      href: https://github.com/mihem/CerebroNexus
    homepage:
      icon: fas fa-globe
      aria-label: Maintainer website
      href: https://mheming.com/

reference:
  - title: "Launch Cerebro"
    contents:
      - starts_with("launchCerebro")
      - downloadDemoData
  - title: "Export data"
    contents:
      - starts_with("exportFrom")
      - exportToH5ad
  - title: "Convert data"
    contents:
      - starts_with("convert")
      - readH5adAsSCE
      - readSpatialDataAsSCE
  - title: "Pre-processing"
    contents:
      - addPercentMtRibo
      - calculatePercentGenes
      - getMostExpressedGenes
      - getMarkerGenes
      - getEnrichedPathways
      - performGeneSetEnrichmentAnalysis
      - extractMonocleTrajectory
  - title: "Internal"
    contents:
      - Cerebro
      - starts_with(".")

articles:
  - title: "Workflows"
    navbar: Workflows
    contents:
      - import_your_analysis
      - cerebronexus_workflow_seurat
