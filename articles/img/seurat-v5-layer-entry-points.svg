<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc">
  <title id="title">All CerebroNexus expression consumers share one layered-assay resolver</title>
  <desc id="desc">Export, conversion, and four preprocessing functions feed into one expression matrix facade. Seurat v3 and v4 use the legacy adapter; Seurat v5 uses the request-driven resolver. A shared cell validator feeds analysis or the three output storage backends.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17324d" flood-opacity=".13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#49677f"/>
    </marker>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #15324a; }
      .subtitle { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #567086; }
      .section { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #597285; letter-spacing: 1px; }
      .node-title { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17324d; }
      .body { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #466277; }
      .badge { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: white; }
      .line { fill: none; stroke: #49677f; stroke-width: 2.8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="830" fill="#f7fbfe"/>
  <text x="60" y="58" class="title">One matrix contract for every public entry point</text>
  <text x="60" y="88" class="subtitle">Users should not need to know which functions previously bypassed split-layer handling.</text>

  <text x="58" y="132" class="section">PUBLIC CONSUMERS</text>
  <g filter="url(#shadow)">
    <rect x="55" y="150" width="295" height="76" rx="17" fill="#e7f4ff" stroke="#4d9fd1" stroke-width="2"/>
    <rect x="55" y="242" width="295" height="76" rx="17" fill="#e7f4ff" stroke="#4d9fd1" stroke-width="2"/>
    <rect x="55" y="334" width="295" height="76" rx="17" fill="#f0edff" stroke="#8069ce" stroke-width="2"/>
    <rect x="55" y="426" width="295" height="76" rx="17" fill="#f0edff" stroke="#8069ce" stroke-width="2"/>
    <rect x="55" y="518" width="295" height="76" rx="17" fill="#f0edff" stroke="#8069ce" stroke-width="2"/>
    <rect x="55" y="610" width="295" height="76" rx="17" fill="#f0edff" stroke="#8069ce" stroke-width="2"/>
  </g>
  <text x="78" y="181" class="node-title">exportFromSeurat()</text>
  <text x="78" y="204" class="body">compatibility fallback + complete cells</text>
  <text x="78" y="273" class="node-title">convertSeuratToCerebro()</text>
  <text x="78" y="296" class="body">fail early before optional calculations</text>
  <text x="78" y="365" class="node-title">calculatePercentGenes()</text>
  <text x="78" y="388" class="body">strict counts</text>
  <text x="78" y="457" class="node-title">getMostExpressedGenes()</text>
  <text x="78" y="480" class="body">strict counts</text>
  <text x="78" y="549" class="node-title">addPercentMtRibo()</text>
  <text x="78" y="572" class="body">strict counts</text>
  <text x="78" y="641" class="node-title" style="font-size:13px">performGeneSetEnrichmentAnalysis()</text>
  <text x="78" y="664" class="body">strict normalized data</text>

  <path d="M 350 188 C 410 188, 405 355, 470 355" class="line"/>
  <path d="M 350 280 C 410 280, 405 355, 470 355" class="line"/>
  <path d="M 350 372 L 470 372" class="line"/>
  <path d="M 350 464 C 410 464, 405 389, 470 389" class="line"/>
  <path d="M 350 556 C 410 556, 405 389, 470 389" class="line"/>
  <path d="M 350 648 C 410 648, 405 389, 470 389" class="line"/>

  <text x="468" y="132" class="section">SHARED RESOLUTION</text>
  <g filter="url(#shadow)">
    <rect x="470" y="275" width="320" height="165" rx="23" fill="#eaf8f3" stroke="#3da477" stroke-width="2.5"/>
  </g>
  <rect x="492" y="295" width="116" height="26" rx="13" fill="#278e68"/>
  <text x="550" y="313" text-anchor="middle" class="badge">ONE GATEWAY</text>
  <text x="495" y="352" class="node-title">.getExpressionMatrix()</text>
  <text x="495" y="379" class="body">• exact request precedence</text>
  <text x="495" y="402" class="body">• request-driven root resolution</text>
  <text x="495" y="425" class="body">• strict or warned compatibility semantics</text>

  <path d="M 630 275 L 630 213" class="line"/>
  <g filter="url(#shadow)">
    <rect x="470" y="150" width="145" height="64" rx="16" fill="#edf5fb" stroke="#719db9" stroke-width="2"/>
    <rect x="645" y="150" width="145" height="64" rx="16" fill="#fff4e7" stroke="#d88a36" stroke-width="2"/>
  </g>
  <text x="542" y="177" text-anchor="middle" class="node-title">Seurat v3/v4</text>
  <text x="542" y="198" text-anchor="middle" class="body">legacy adapter</text>
  <text x="717" y="177" text-anchor="middle" class="node-title">Seurat v5</text>
  <text x="717" y="198" text-anchor="middle" class="body">layer resolver</text>

  <path d="M 790 357 L 850 357" class="line"/>
  <text x="848" y="132" class="section">ONE COVERAGE CONTRACT</text>
  <g filter="url(#shadow)">
    <rect x="850" y="275" width="295" height="165" rx="23" fill="#fff9e8" stroke="#dba13c" stroke-width="2.5"/>
  </g>
  <text x="875" y="317" class="node-title">.validate_expression_cells()</text>
  <text x="875" y="350" class="body">• require named columns</text>
  <text x="875" y="375" class="body">• compare complete cell sets</text>
  <text x="875" y="400" class="body">• report missing / unexpected cells</text>
  <text x="875" y="425" class="body">• reorder once to object order</text>

  <path d="M 997 440 L 997 502" class="line"/>
  <text x="580" y="500" class="section">VALIDATED DESTINATIONS</text>
  <g filter="url(#shadow)">
    <rect x="470" y="518" width="200" height="96" rx="18" fill="#eaf7ef" stroke="#4aa96e" stroke-width="2"/>
    <rect x="690" y="518" width="140" height="96" rx="18" fill="#e7f4ff" stroke="#4d9fd1" stroke-width="2"/>
    <rect x="850" y="518" width="140" height="96" rx="18" fill="#f0edff" stroke="#8069ce" stroke-width="2"/>
    <rect x="1010" y="518" width="135" height="96" rx="18" fill="#fff1df" stroke="#d88a36" stroke-width="2"/>
  </g>
  <text x="570" y="555" text-anchor="middle" class="node-title">Analysis result</text>
  <text x="570" y="579" text-anchor="middle" class="body">metadata / tables</text>
  <text x="570" y="599" text-anchor="middle" class="body">all object cells</text>
  <text x="760" y="555" text-anchor="middle" class="node-title">embedded</text>
  <text x="760" y="583" text-anchor="middle" class="body">matrix in .crb</text>
  <text x="920" y="555" text-anchor="middle" class="node-title">HDF5</text>
  <text x="920" y="583" text-anchor="middle" class="body">sibling .h5</text>
  <text x="1077" y="555" text-anchor="middle" class="node-title">BPCells</text>
  <text x="1077" y="583" text-anchor="middle" class="body">sibling directory</text>

  <path d="M 997 502 C 997 480, 570 480, 570 518" class="line"/>
  <path d="M 997 502 C 997 492, 760 492, 760 518" class="line"/>
  <path d="M 997 502 C 997 500, 920 500, 920 518" class="line"/>
  <path d="M 997 502 L 1077 518" class="line"/>

  <g filter="url(#shadow)">
    <rect x="470" y="660" width="675" height="105" rx="20" fill="#ffffff" stroke="#bfd7e5" stroke-width="2"/>
  </g>
  <text x="495" y="697" class="node-title">Result: storage and analysis no longer define correctness</text>
  <text x="495" y="725" class="body">A matrix is resolved and validated once under the same cell and semantic contract.</text>
  <text x="495" y="749" class="body">Backend selection changes representation only; it cannot change which cells were exported.</text>
</svg>
