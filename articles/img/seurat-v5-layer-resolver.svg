<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1100" role="img" aria-labelledby="title desc">
  <title id="title">Request-driven Seurat v5 layer resolver decision flow</title>
  <desc id="desc">The resolver validates the assay, honours an exact layer, otherwise searches candidates for the requested root. It uses a linear partition fast path, then an indexed exact-cover fallback. A unique partition is isolated and joined, an ambiguous partition errors, and absent strict requests either error or use an explicit warned compatibility fallback. Complete-cell consumers validate and reorder the matrix.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#17324d" flood-opacity=".13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#49677f"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f976b"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c44250"/>
    </marker>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #15324a; }
      .subtitle { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #567086; }
      .node-title { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17324d; }
      .body { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #405d72; }
      .branch { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4f6a7e; }
      .badge { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: white; letter-spacing: .4px; }
      .line { fill: none; stroke: #49677f; stroke-width: 3; marker-end: url(#arrow); }
      .good { fill: none; stroke: #2f976b; stroke-width: 3; marker-end: url(#arrow-green); }
      .bad { fill: none; stroke: #c44250; stroke-width: 3; marker-end: url(#arrow-red); }
    </style>
  </defs>

  <rect width="1200" height="1100" fill="#f7fbfe"/>
  <text x="60" y="58" class="title">One request, one deterministic resolution path</text>
  <text x="60" y="88" class="subtitle">The resolver never scans a global root whitelist and never accepts a partial fallback.</text>

  <g filter="url(#shadow)">
    <rect x="410" y="120" width="380" height="74" rx="20" fill="#e9f5ff" stroke="#4c9fd1" stroke-width="2"/>
  </g>
  <text x="600" y="151" text-anchor="middle" class="node-title">Request assay = "RNA", layer = "data"</text>
  <text x="600" y="176" text-anchor="middle" class="body">Validate assay, request, and Seurat version</text>

  <path d="M 600 194 L 600 235" class="line"/>
  <g filter="url(#shadow)">
    <path d="M 600 230 L 770 295 L 600 360 L 430 295 Z" fill="#fff9e9" stroke="#dba13c" stroke-width="2"/>
  </g>
  <text x="600" y="290" text-anchor="middle" class="node-title">Exact physical layer exists?</text>
  <text x="600" y="315" text-anchor="middle" class="body">Exact names are authoritative</text>

  <path d="M 430 295 L 260 295 L 260 382" class="good"/>
  <text x="345" y="282" text-anchor="middle" class="branch">YES</text>
  <g filter="url(#shadow)">
    <rect x="75" y="382" width="370" height="82" rx="18" fill="#eaf8f2" stroke="#3ca476" stroke-width="2"/>
  </g>
  <text x="260" y="415" text-anchor="middle" class="node-title">Read exact layer unchanged</text>
  <text x="260" y="441" text-anchor="middle" class="body">Never join away data.sample_b or data.imputed</text>

  <path d="M 600 360 L 600 406" class="line"/>
  <text x="618" y="390" class="branch">NO</text>
  <g filter="url(#shadow)">
    <rect x="440" y="406" width="320" height="82" rx="18" fill="#edf5fb" stroke="#6d9cbb" stroke-width="2"/>
  </g>
  <text x="600" y="438" text-anchor="middle" class="node-title">Ask Seurat for prefix candidates</text>
  <text x="600" y="464" text-anchor="middle" class="body">Layers(assay, search = requested layer)</text>

  <path d="M 600 488 L 600 529" class="line"/>
  <g filter="url(#shadow)">
    <path d="M 600 524 L 795 594 L 600 664 L 405 594 Z" fill="#f0edff" stroke="#8069ce" stroke-width="2"/>
  </g>
  <text x="600" y="579" text-anchor="middle" class="node-title" style="font-size:16px">All candidates form one disjoint cover?</text>
  <text x="600" y="604" text-anchor="middle" class="body">One ownership count over all memberships</text>
  <rect x="530" y="619" width="140" height="24" rx="12" fill="#7159c1"/>
  <text x="600" y="636" text-anchor="middle" class="badge">LINEAR FAST PATH</text>

  <path d="M 405 594 L 230 594 L 230 700" class="good"/>
  <text x="345" y="581" text-anchor="middle" class="branch">YES</text>

  <path d="M 795 594 L 940 594 L 940 700" class="line"/>
  <text x="858" y="581" text-anchor="middle" class="branch">NO</text>

  <g filter="url(#shadow)">
    <rect x="755" y="700" width="370" height="100" rx="18" fill="#fff4e7" stroke="#dc8b34" stroke-width="2"/>
  </g>
  <text x="940" y="733" text-anchor="middle" class="node-title">Indexed exact-cover fallback</text>
  <text x="940" y="758" text-anchor="middle" class="body">Precompute adjacency and conflicts;</text>
  <text x="940" y="781" text-anchor="middle" class="body">stop after finding two solutions</text>

  <g filter="url(#shadow)">
    <rect x="75" y="700" width="310" height="90" rx="18" fill="#eaf8f2" stroke="#3ca476" stroke-width="2"/>
  </g>
  <text x="230" y="735" text-anchor="middle" class="node-title">Unique partition selected</text>
  <text x="230" y="762" text-anchor="middle" class="body">Normal split objects arrive here</text>

  <g filter="url(#shadow)">
    <rect x="205" y="840" width="485" height="100" rx="20" fill="#e9f8f3" stroke="#3ca476" stroke-width="2"/>
  </g>
  <text x="447" y="873" text-anchor="middle" class="node-title">Isolate non-selected prefix layers, then join</text>
  <text x="447" y="900" text-anchor="middle" class="body">Operate on a local object and only on the requested root</text>
  <text x="447" y="923" text-anchor="middle" class="body">Extract one matrix and discard the temporary object</text>

  <path d="M 230 790 L 230 840" class="good"/>
  <path d="M 755 750 L 690 750 L 690 875" class="good"/>
  <text x="715" y="737" class="branch">1 SOLUTION</text>

  <g filter="url(#shadow)">
    <rect x="735" y="840" width="180" height="110" rx="18" fill="#fff0f1" stroke="#cf5360" stroke-width="2"/>
  </g>
  <text x="825" y="874" text-anchor="middle" class="node-title">2 solutions</text>
  <text x="825" y="901" text-anchor="middle" class="body">ambiguous</text>
  <text x="825" y="926" text-anchor="middle" class="body">→ explicit error</text>
  <path d="M 875 800 L 825 840" class="bad"/>

  <g filter="url(#shadow)">
    <rect x="945" y="840" width="200" height="110" rx="18" fill="#fff9e9" stroke="#dba13c" stroke-width="2"/>
  </g>
  <text x="1045" y="870" text-anchor="middle" class="node-title">0 solutions</text>
  <text x="1045" y="896" text-anchor="middle" class="body">strict → error</text>
  <text x="1045" y="921" text-anchor="middle" class="body">compatibility → complete</text>
  <text x="1045" y="941" text-anchor="middle" class="body">fallback + warning</text>
  <path d="M 1005 800 L 1045 840" class="line"/>

  <path d="M 260 464 L 260 995 L 400 995" class="good"/>
  <path d="M 447 940 L 447 970" class="good"/>
  <path d="M 1045 950 L 1045 1015 L 800 1015" class="good"/>
  <g filter="url(#shadow)">
    <rect x="400" y="970" width="400" height="82" rx="18" fill="#e7f4ff" stroke="#4c9fd1" stroke-width="2"/>
  </g>
  <text x="600" y="1003" text-anchor="middle" class="node-title">Complete-matrix consumer</text>
  <text x="600" y="1029" text-anchor="middle" class="body">validate the full cell set and reorder once</text>
  <text x="600" y="1080" text-anchor="middle" class="subtitle">Partial matrices never continue to full-object analysis or export.</text>
</svg>
