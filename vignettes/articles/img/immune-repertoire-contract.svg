<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="500" viewBox="0 0 1180 500" role="img" aria-labelledby="title desc">
  <title id="title">Immune repertoire identity contract</title>
  <desc id="desc">TCR, BCR, metadata, and Cell Ranger inputs are normalized, validated for one globally unique cell barcode per row, and exported as one named table per sample.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff8f2"/>
      <stop offset="1" stop-color="#f4f8ff"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#24304a" flood-opacity=".16"/>
    </filter>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#526079"/>
    </marker>
    <style>
      .title{font:700 27px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17233c}
      .head{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:white}
      .body{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#26334d}
      .small{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#526079}
      .chip{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#26334d}
    </style>
  </defs>
  <rect width="1180" height="500" rx="28" fill="url(#bg2)"/>
  <text x="590" y="48" text-anchor="middle" class="title">One repertoire row = one globally unique cell</text>

  <g filter="url(#shadow2)">
    <rect x="40" y="92" width="235" height="316" rx="22" fill="#fff"/>
    <rect x="40" y="92" width="235" height="54" rx="22" fill="#d4577a"/>
    <rect x="40" y="124" width="235" height="22" fill="#d4577a"/>
    <text x="157" y="126" text-anchor="middle" class="head">Accepted inputs</text>
    <rect x="70" y="175" width="175" height="38" rx="11" fill="#ffe8ef"/>
    <text x="157" y="199" text-anchor="middle" class="chip">TCR / BCR lists</text>
    <rect x="70" y="229" width="175" height="38" rx="11" fill="#fff0dd"/>
    <text x="157" y="253" text-anchor="middle" class="chip">RDS / Cell Ranger CSV</text>
    <rect x="70" y="283" width="175" height="38" rx="11" fill="#e9efff"/>
    <text x="157" y="307" text-anchor="middle" class="chip">Seurat metadata</text>
    <text x="157" y="360" text-anchor="middle" class="small">explicit data wins</text>
    <text x="157" y="383" text-anchor="middle" class="small">metadata is fallback</text>
  </g>

  <path d="M285 250 H345" stroke="#526079" stroke-width="4" fill="none" marker-end="url(#arrow2)"/>

  <g filter="url(#shadow2)">
    <rect x="355" y="92" width="265" height="316" rx="22" fill="#fff"/>
    <rect x="355" y="92" width="265" height="54" rx="22" fill="#6c5ce7"/>
    <rect x="355" y="124" width="265" height="22" fill="#6c5ce7"/>
    <text x="487" y="126" text-anchor="middle" class="head">Normalize by sample</text>
    <text x="385" y="188" class="body">Derive or require sample IDs</text>
    <text x="385" y="229" class="body">Drop zero-row samples</text>
    <text x="385" y="270" class="body">Row-bind TCR + BCR</text>
    <text x="385" y="311" class="body">Fill missing extra columns</text>
    <rect x="385" y="341" width="205" height="39" rx="12" fill="#efeaff"/>
    <text x="487" y="366" text-anchor="middle" class="chip">one table per sample</text>
  </g>

  <path d="M630 250 H690" stroke="#526079" stroke-width="4" fill="none" marker-end="url(#arrow2)"/>

  <g filter="url(#shadow2)">
    <rect x="700" y="92" width="250" height="316" rx="22" fill="#fff"/>
    <rect x="700" y="92" width="250" height="54" rx="22" fill="#00a896"/>
    <rect x="700" y="124" width="250" height="22" fill="#00a896"/>
    <text x="825" y="126" text-anchor="middle" class="head">Prove row identity</text>
    <text x="730" y="181" class="body">✓ five standard columns</text>
    <text x="730" y="220" class="body">✓ non-empty barcode</text>
    <text x="730" y="259" class="body">✓ no duplicate row</text>
    <text x="730" y="298" class="body">✓ unique across samples</text>
    <text x="730" y="337" class="body">✓ reaches a Seurat cell</text>
    <rect x="730" y="358" width="190" height="30" rx="10" fill="#ddf8f0"/>
    <text x="825" y="378" text-anchor="middle" class="chip">TCR/BCR overlap = error</text>
  </g>

  <path d="M960 250 H1020" stroke="#526079" stroke-width="4" fill="none" marker-end="url(#arrow2)"/>

  <g filter="url(#shadow2)">
    <rect x="1030" y="92" width="110" height="316" rx="22" fill="#fff"/>
    <rect x="1030" y="92" width="110" height="54" rx="22" fill="#f39c3d"/>
    <rect x="1030" y="124" width="110" height="22" fill="#f39c3d"/>
    <text x="1085" y="126" text-anchor="middle" class="head">Export</text>
    <circle cx="1085" cy="224" r="39" fill="#fff0df" stroke="#f39c3d" stroke-width="4"/>
    <path d="M1065 224 L1079 238 L1106 207" fill="none" stroke="#dc6f13" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1085" y="300" text-anchor="middle" class="body">unified</text>
    <text x="1085" y="326" text-anchor="middle" class="body">slot</text>
    <text x="1085" y="370" text-anchor="middle" class="small">app-ready</text>
  </g>

  <path d="M825 424 C825 472 487 472 487 424" stroke="#d74f6a" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#arrow2)"/>
  <text x="656" y="484" text-anchor="middle" class="small">identity failure stops before a CRB or sidecar is replaced</text>
</svg>
